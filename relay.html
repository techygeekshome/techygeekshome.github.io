<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>relay</title></head><body>
<p id="s">Working...</p>
<script>
// Hands a file from the temporary upload branch to the page that opened this window (used for uploading Dodgy or Not? videos).
(async function(){var p=new URLSearchParams(location.search),f=p.get('f');var s=document.getElementById('s');
if(!f||!/^[\w.-]+$/.test(f)||!window.opener){s.textContent='Nothing to do.';return}
try{var r=await fetch('https://raw.githubusercontent.com/techygeekshome/techygeekshome.github.io/dodgy-upload-tmp/'+f);var b=await r.blob();
window.opener.postMessage({relayFile:f,blob:b},'*');s.textContent='Sent '+f+' ('+b.size+' bytes)';setTimeout(function(){window.close()},1500)}catch(e){s.textContent='Error: '+e.message}})();
</script></body></html>
